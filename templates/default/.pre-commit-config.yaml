# guardrails — curated gate set, run by `prek` (pre-commit compatible). Tools come from the
# guardrails devShell (lib.mkDevShell), so `entry` commands are on PATH. Copy this into a consuming
# repo (or scaffold via `nix flake init -t github:gerchowl/guardrails`).
#
# Every entry is wrapped in `guardrails-trace <name> -- <cmd>`: one JSONL row per gate run
# (duration/verdict/exit) in the XDG cache, streams + exit code untouched. That history powers
# `guardrails info --perf` (tiering data) and `guardrails last` (a piped stdout can't swallow a
# FAIL). Drop the wrapper from any entry to opt that gate out of tracing.
repos:
  - repo: local
    hooks:
      # protect-trunk: trunk advances by merge/PR only, never a local commit/push.
      # PR-flow repos: keep as-is. Trunk-flow (solo, commit-to-main) repos: opt out with
      #   export GUARDRAILS_PROTECTED_BRANCHES=""   (e.g. .envrc / devShell)
      # Intentional trunk write (hotfix): GUARDRAILS_ALLOW_TRUNK=1 git commit/push.
      - id: protect-trunk
        name: no direct commits on trunk (branch, then PR)
        entry: guardrails-trace protect-trunk -- guardrails-protect-trunk
        language: system
        always_run: true
        pass_filenames: false
      - id: protect-trunk-push
        name: no pushes advancing a protected remote ref
        entry: guardrails-trace protect-trunk-push -- guardrails-protect-trunk-push
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false
      - id: no-fake-impl
        name: no fake/placeholder implementations
        entry: guardrails-trace no-fake-impl -- guardrails-no-fake-impl
        language: system
        pass_filenames: true
      - id: no-debug-leftovers
        name: no debug-print leftovers (use the tracing facade)
        entry: guardrails-trace no-debug-leftovers -- guardrails-no-debug-leftovers
        language: system
        pass_filenames: true
      - id: no-commented-code
        name: no commented-out code
        entry: guardrails-trace no-commented-code -- guardrails-no-commented-code
        language: system
        pass_filenames: true
      - id: derived-docs
        name: derived docs match their source-of-truth command
        entry: guardrails-trace derived-docs -- guardrails-derived-docs
        language: system
        pass_filenames: true
      - id: no-conflict-markers
        name: no committed merge-conflict markers
        entry: guardrails-trace no-conflict-markers -- guardrails-no-conflict-markers
        language: system
        pass_filenames: true
      - id: ci-shim
        name: CI is a shim over `nix flake check` (nudge)
        entry: guardrails-trace ci-shim -- guardrails-ci-shim
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
        pass_filenames: true
      - id: duplication
        name: no reinvented clones (nudge)
        entry: guardrails-trace duplication -- guardrails-duplication
        language: system
        # Cross-file by nature: scans the whole tree (not just staged files),
        # but only fires when a source file changed. Nudge — never blocks.
        files: \.(rs|go|py|ts|tsx|js|jsx|c|h|cc|cpp|hpp|java|rb|sh|nix)$
        pass_filenames: false
      - id: gitleaks
        name: secrets scan
        entry: guardrails-trace gitleaks -- gitleaks protect --staged --redact -v
        language: system
        pass_filenames: false
      - id: rustfmt
        name: rustfmt
        entry: guardrails-trace rustfmt -- cargo fmt --all -- --check
        language: system
        files: \.rs$
        pass_filenames: false
      - id: clippy
        name: clippy (-D warnings)
        entry: guardrails-trace clippy -- cargo clippy --all-targets --all-features -- -D warnings
        language: system
        files: \.rs$
        pass_filenames: false
      - id: cargo-deny
        name: cargo-deny (licenses + advisories)
        entry: guardrails-trace cargo-deny -- cargo deny check
        language: system
        files: Cargo\.(toml|lock)$
        pass_filenames: false
      # Numerical-obligation ratchet — wire as a pre-PUSH hook (CI-deep, not pre-commit):
      # the measurer runs separately and writes the measurement JSON files. Uncomment + add a
      # `numerical-obligation.toml` to enable. See templates/default/numerical-obligation.toml.
      # - id: numerical-obligation
      #   name: numerical obligations (parity errors / HARD counts / coverage % / ...)
      #   entry: guardrails-numerical-obligation
      #   language: system
      #   stages: [pre-push]
      #   pass_filenames: false
